apiVersion: zeabur.com/v1
kind: Template
metadata:
  name: Manxue AI
spec:
  description: 自托管的模型接口观察站，通过 SVG 动画生成和逻辑题检测记录模型表现
  icon: https://raw.githubusercontent.com/fishxcode/pelecanus/main/app/web/favicon.svg
  tags:
    - AI
    - Monitoring
    - Tool
  resourceRequirement:
    minConfig:
      cpu: 1
      ram: 1
    recommendedConfig:
      cpu: 2
      ram: 2
  variables:
    - key: ADMIN_TOKEN
      type: PASSWORD
      name: 管理密码
      description: 必填，12–256 个字符。留空服务将无法启动。仅用于首次初始化，之后改这里不会改掉已保存的密码。
    - key: PUBLIC_DOMAIN
      type: DOMAIN
      name: 访问域名
      description: 公开页面和后台的访问域名，Zeabur 自动签发 HTTPS 证书。
  readme: |
    # Manxue AI

    自托管的模型接口观察站。部署后需要自行配置 API 节点，服务本身不附带任何模型凭据。

    ## 部署后要做的事

    1. 打开 `https://<你的域名>/admin`，用部署时填写的管理密码登录。
    2. 编辑默认节点，把示例地址换成实际的 OpenAI 兼容 API 地址，填入 API Key、模型名称和协议。
    3. 执行一次检测确认接口可用，再开启自动检测。默认间隔 30 分钟，自动检测初始关闭。

    动画视觉审核使用同一节点的模型，需要该模型支持图片输入。

    ## 需要知道的限制

    - **管理密码只能初始化一次。** 密码写入数据库后，修改 `ADMIN_TOKEN` 环境变量不会覆盖它。
      Zeabur 上也无法通过页面重设（该通道仅对本机回环地址开放）。忘记密码只能删除数据卷重来，
      届时历史记录一并丢失。
    - **不要扩容到多副本。** 服务用 SQLite 存储并持有数据目录的独占锁，多副本会启动失败。
    - **重新部署会短暂停机。** 挂载持久卷的服务使用 Recreate 策略，先停旧实例再起新实例。
    - **内存建议不低于 1 GB。** 视觉审核会拉起 Chromium 截图，内存过低会导致渲染进程被杀。
    - **API Key 以明文存于数据卷中的 SQLite。** 数据库本身没有加密，仅靠文件权限保护。

    ## 关于检测结果

    糖果题按回答中是否出现独立数字 `21` 判定，不做完整语义评分。视觉审核是模型对动画截图的
    判断，可能误判。这些检测不证明模型身份，也不代表模型的整体能力。
  services:
    - name: manxue-ai
      icon: https://raw.githubusercontent.com/fishxcode/pelecanus/main/app/web/favicon.svg
      template: GIT
      domainKey: PUBLIC_DOMAIN
      spec:
        source:
          source: ARBITRARY_GIT
          gitURL: https://github.com/fishxcode/pelecanus.git
          branch: main
        ports:
          # 与根目录 Dockerfile 的 EXPOSE 和下面的 PORT 保持一致，三者不一致会导致健康检查不通过。
          - id: web
            port: 8765
            type: HTTP
        volumes:
          - id: data
            dir: /data
        env:
          HOST:
            default: "0.0.0.0"
          PORT:
            default: "8765"
          DATA_DIR:
            default: "/data"
          ADMIN_TOKEN:
            default: ${ADMIN_TOKEN}
        healthCheck:
          type: HTTP
          port: web
          http:
            path: /api/auth/status
        instructions:
          - title: 公开页面
            content: ${ZEABUR_WEB_URL}
          - title: 管理后台
            content: ${ZEABUR_WEB_URL}/admin
          - title: 登录方式
            content: 使用部署时填写的管理密码登录
